<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, title)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Smart WMS - Vezérlőpult</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<aside class="sidebar d-flex flex-column justify-content-between p-3">
    <div>
        <div class="d-flex align-items-center gap-2 px-3 py-2 mb-4 text-white">
            <i class="bi bi-box-seam-fill fs-4 text-primary"></i>
            <span class="fs-5 fw-bold tracking-wide">Smart WMS</span>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Vezérlőpult</a>
            <a class="nav-link" th:classappend="${activeMenu == 'products'} ? ' active' : ''" th:href="@{/admin/products}"><i class="bi bi-boxes"></i> Terméktörzs</a>
            <a class="nav-link" th:classappend="${activeMenu == 'warehouses'} ? ' active' : ''" th:href="@{/admin/warehouses}"><i class="bi bi-diagram-3"></i> Raktárstruktúra</a>
            <a class="nav-link" th:classappend="${activeMenu == 'inventory'} ? ' active' : ''" th:href="@{/admin/inventory}"><i class="bi bi-clipboard-data"></i> Leltár & Készlet</a>
            <a class="nav-link" th:classappend="${activeMenu == 'scrap'} ? ' active' : ''" th:href="@{/admin/scrap}"><i class="bi bi-trash3"></i> Selejtezések</a>
            <a class="nav-link" th:classappend="${activeMenu == 'audit'} ? ' active' : ''" th:href="@{/admin/audit}"><i class="bi bi-journal-text"></i> Mozgásnapló</a>
            <a class="nav-link" th:classappend="${activeMenu == 'users'} ? ' active' : ''" th:href="@{/admin/users}"><i class="bi bi-people"></i> Felhasználók</a>
        </nav>
    </div>
    <div class="border-top border-secondary pt-3 px-3">
        <div class="d-flex align-items-center justify-content-between text-white">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-4 text-secondary"></i>
                <div>
                    <div class="small fw-bold" th:text="${currentUsername ?: 'Adminisztrátor'}">Adminisztrátor</div>
                    <div class="text-secondary" style="font-size: 0.75rem;" th:text="${currentUserRole ?: 'Diszpécser'}">Diszpécser</div>
                </div>
            </div>
            <a th:href="@{/logout}" class="text-secondary hover-white"><i class="bi bi-box-arrow-right fs-5"></i></a>
        </div>
    </div>
</aside>

<main class="main-content">
    <div th:replace="${content}">
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
